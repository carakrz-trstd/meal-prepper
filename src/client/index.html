<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a1a10" />
    <title>Meal Prepper</title>
    <script>
      // apply the remembered theme before the first paint, so the page does not flash in the other look
      try {
        var t = localStorage.getItem('mealprepper-theme');
        if (t === 'dungeon') {
          document.documentElement.dataset.theme = 'dungeon';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0d12');
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 12v18c0 15-10 26-24 30C18 56 8 45 8 30V12z' fill='%237a1f2b' stroke='%23c9a227' stroke-width='4'/%3E%3Cpath d='M32 14v34M22 24h20' stroke='%23e6c35c' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
